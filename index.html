<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Discipline Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f9;--card:#fff;--tx:#14161f;--mu:#6b7080;--ac:#5b5bf0;--gr:#12a150;--rd:#d93030;--yl:#c98a00;--bd:#e2e4ee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d29;--tx:#eceef6;--mu:#9a9fb2;--bd:#2a2e3f}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d29;--tx:#eceef6;--mu:#9a9fb2;--bd:#2a2e3f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:12px;max-width:560px;margin:auto}
h1{font-size:18px;margin:4px 0 10px}h2{font-size:15px;margin:0 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.ban{border-radius:14px;padding:14px;margin-bottom:10px;font-weight:600}
.go{background:rgba(18,161,80,.15);border:1px solid var(--gr)}.stop{background:rgba(217,48,48,.15);border:1px solid var(--rd)}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.k{flex:1;min-width:90px;background:var(--bg);border-radius:10px;padding:8px}.k b{display:block;font-size:17px}
input,select,button{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
button{background:var(--ac);color:#fff;border:0;font-weight:600}button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
label.ck{display:flex;gap:8px;align-items:flex-start;padding:6px 0}label.ck input{margin-top:3px}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.w{color:var(--gr)}.l{color:var(--rd)}ol{padding-left:20px;margin:6px 0}li{margin:4px 0}
.t{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}
details>summary{font-weight:600;cursor:pointer}
</style></head><body>
<h1>📈 Trading Discipline Tracker</h1>
<div id="app"></div>
<script>
const $=id=>document.getElementById(id);
let S={cfg:{eq:4749.35,floor:4600,rate:88,saved:0},tr:[],chk:{d:'',v:[]}};
try{const r=localStorage.getItem('tp1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('tp1',JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toLocaleDateString('en-CA');
const f=n=>(n<0?'-$':'$')+Math.abs(n).toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RULES=["Max 1 trade per session. Gold 6:30 am, US30 7:00 pm. 2 trades a day, never more.","Win or loss, that session is OVER. Close the chart. No 'one more'.","Never trade right after a loss to win it back. Walk away 30 minutes minimum.","Stop loss goes in BEFORE entry. Risk is fixed (see top box). Never widen the stop.","Enter only after a 15m candle CLOSES beyond the level, in the 4H/1D trend direction. A wick is not a breakout.","Target at least 2R (twice what you risk). Move stop to breakeven at 1R if you want.","Only one trade open at a time. Never stack trades.","Daily stop: -$60. Weekly stop: -$120. Hit it and you are done till the next day/week.","Log every trade in this app within 5 minutes, honestly.","Sunday: 10-minute review. Did I follow the rules? That is the only score that matters."];
const CHECKS=["I wrote down the 4H/1D trend (up / down / sideways)","The level is clear (touched 2+ times)","A 15m candle has CLOSED beyond the level","Trade goes WITH the higher-timeframe trend","Stop loss is set and risk is within today's limit","Target is at least 2R","No other trade is open and I am calm (not chasing)"];
function add(){const ses=$('ses').value,res=$('res').value;let a=Math.abs(parseFloat($('amt').value)||0);if(res!=='be'&&!a){alert('Enter the $ amount');return}
const amt=res==='win'?a:res==='loss'?-a:0;S.tr.push({id:Date.now(),d:today(),ses,res,amt,ok:$('ok').checked,note:$('note').value.slice(0,120)});S.cfg.eq=+(S.cfg.eq+amt).toFixed(2);save();render()}
function del(id){const t=S.tr.find(x=>x.id===id);if(!t)return;S.cfg.eq=+(S.cfg.eq-t.amt).toFixed(2);S.tr=S.tr.filter(x=>x.id!==id);save();render()}
function cfg(k,v){S.cfg[k]=parseFloat(v)||0;save();render()}
function ck(i){if(S.chk.d!==today())S.chk={d:today(),v:[]};S.chk.v[i]=!S.chk.v[i];save();render()}
function render(){const c=S.cfg,td=today();if(S.chk.d!==td)S.chk={d:td,v:[]};
const buf=c.eq-c.floor,ph=c.eq<4850?1:c.eq<5000?2:3,risk=ph===1?20:30;
const names=["Phase 1: SURVIVE (rebuild buffer)","Phase 2: CONSISTENT (get back to start balance)","Phase 3: GROW (pass / earn payouts)"];
const T=S.tr.filter(t=>t.d===td),pnl=T.reduce((a,t)=>a+t.amt,0);
const wk=new Date();wk.setDate(wk.getDate()-6);const wks=wk.toLocaleDateString('en-CA');
const wpnl=S.tr.filter(t=>t.d>=wks).reduce((a,t)=>a+t.amt,0);
const done=s=>T.some(t=>t.ses===s);
let why=[];if(T.length>=2)why.push('2 trades done');if(pnl<=-60)why.push('daily stop -$60 hit');if(wpnl<=-120)why.push('weekly stop hit');if(buf<=risk*2)why.push('buffer too thin: ask yourself if you should pause');
const hard=T.length>=2||pnl<=-60||wpnl<=-120;
const open=['XAUUSD','US30'].filter(s=>!done(s));
let ban=hard?`<div class="ban stop">🛑 DONE FOR TODAY. Close the charts.<div class="mu">${why.join(' · ')}</div></div>`:
open.length?`<div class="ban go">✅ You may take ONE trade in: ${open.join(' / ')}<div class="mu">Risk max $${risk}. If it loses or wins, that session is over.</div></div>`:`<div class="ban stop">🛑 Both sessions done. Close the charts.</div>`;
if(!hard&&why.length)ban+=`<div class="ban stop">⚠️ ${why.join(' · ')}</div>`;
const last30=new Date();last30.setDate(last30.getDate()-29);const L=S.tr.filter(t=>t.d>=last30.toLocaleDateString('en-CA'));
const W=L.filter(t=>t.res==='win'),Ls=L.filter(t=>t.res==='loss'),dec=W.length+Ls.length;
const wr=dec?Math.round(W.length/dec*100):0,aw=W.length?W.reduce((a,t)=>a+t.amt,0)/W.length:0,al=Ls.length?Math.abs(Ls.reduce((a,t)=>a+t.amt,0))/Ls.length:0;
const disc=L.length?Math.round(L.filter(t=>t.ok).length/L.length*100):0;
const days={};S.tr.forEach(t=>{(days[t.d]=days[t.d]||[]).push(t)});let st=0;Object.keys(days).sort().reverse().forEach(d=>{if(st>=0&&days[d].every(t=>t.ok)&&days[d].length<=2)st++;else st=-st-1});st=st<0?0:st;
const be=aw&&al?Math.round(al/(al+aw)*100):0;
let rem=c.saved;const G=[["📱 iPhone",140000],["📊 2× The5ers 100k (≈$800)",800*c.rate],["🎮 PS5 (≈₹55,000)",55000]];
const gh=G.map(([n,v])=>{const p=Math.max(0,Math.min(1,rem/v));rem-=v;return`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${n}</span><span class="mu">₹${Math.round(v).toLocaleString('en-IN')} · ${Math.round(p*100)}%</span></div><div class="bar"><i style="width:${p*100}%"></i></div></div>`}).join('');
$('app').innerHTML=`${ban}
<div class="c"><div class="mu">${names[ph-1]}</div><div class="row" style="margin-top:8px">
<div class="k"><span class="mu">Equity</span><b>${f(c.eq)}</b></div><div class="k"><span class="mu">Buffer to breach</span><b class="${buf<150?'l':''}">${f(buf)}</b></div><div class="k"><span class="mu">Max risk/trade</span><b>$${risk}</b></div><div class="k"><span class="mu">Losses left</span><b>${Math.floor(buf/risk)}</b></div></div></div>
<details class="c" open><summary>📜 My 10 rules (read before every session)</summary><ol>${RULES.map(r=>`<li>${r}</li>`).join('')}</ol></details>
<div class="c"><h2>Pre-trade checklist (all must be ticked)</h2>${CHECKS.map((x,i)=>`<label class="ck"><input type="checkbox" ${S.chk.v[i]?'checked':''} onchange="ck(${i})"><span>${x}</span></label>`).join('')}
<div class="mu">${CHECKS.every((_,i)=>S.chk.v[i])?'✅ Checklist complete. You may enter.':'Any box empty = no trade.'}</div></div>
<div class="c"><h2>Log a trade</h2><div class="row"><select id="ses"><option>XAUUSD</option><option>US30</option></select><select id="res"><option value="win">Win</option><option value="loss">Loss</option><option value="be">Breakeven</option></select><input id="amt" type="number" inputmode="decimal" placeholder="$ amount" style="width:100px"></div>
<label class="ck"><input id="ok" type="checkbox" checked><span>I followed every rule on this trade</span></label><input id="note" placeholder="Note (optional)" style="width:100%;margin-bottom:8px"><button onclick="add()" style="width:100%">Add trade</button>
<div style="margin-top:8px"><b>Today</b> <span class="${pnl<0?'l':'w'}">${f(pnl)}</span>${T.map(t=>`<div class="t"><span>${t.ses} · ${t.res} ${t.amt?f(t.amt):''} ${t.ok?'✅':'⚠️ broke rules'}<br><span class="mu">${esc(t.note)}</span></span><button class="g" onclick="del(${t.id})">✕</button></div>`).join('')}</div></div>
<div class="c"><h2>Last 30 days</h2><div class="row"><div class="k"><span class="mu">Win rate</span><b>${wr}%</b></div><div class="k"><span class="mu">Avg win / loss</span><b>$${aw.toFixed(0)} / $${al.toFixed(0)}</b></div><div class="k"><span class="mu">Rules followed</span><b>${disc}%</b></div><div class="k"><span class="mu">Clean-day streak</span><b>${st} 🔥</b></div></div>
<p class="mu">Break-even win rate with your current averages: ${be?be+'%':'—'}. Last 7 days: <b class="${wpnl<0?'l':'w'}">${f(wpnl)}</b></p></div>
<div class="c"><h2>🎯 Goals</h2>${gh}<div class="row"><span class="mu">Saved from trading so far (₹)</span><input type="number" inputmode="decimal" value="${c.saved}" onchange="cfg('saved',this.value)" style="width:120px"></div><div class="mu" style="margin-top:6px">Goals fill in order. Only count money you actually withdrew as payout.</div></div>
<details class="c"><summary>⚙️ Settings</summary><div class="row" style="margin-top:8px"><label class="mu">Equity $<input type="number" value="${c.eq}" onchange="cfg('eq',this.value)" style="width:110px"></label><label class="mu">Breach level $<input type="number" value="${c.floor}" onchange="cfg('floor',this.value)" style="width:100px"></label><label class="mu">₹ per $<input type="number" value="${c.rate}" onchange="cfg('rate',this.value)" style="width:70px"></label></div><p class="mu">Equity updates when you log trades. Re-sync it with your broker now and then. Data stays on this device only.</p></details>`}
render();
</script></body></html>
